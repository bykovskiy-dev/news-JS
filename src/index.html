<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>News Portal</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;600;800&display=swap"
            rel="stylesheet"
        />
    </head>
    <body class="page">
        <header class="header">
            <div class="page__container header__inner">
                <p class="header__eyebrow">RSSchool · News API</p>
                <h1 class="header__title">News Portal</h1>
            </div>
        </header>

        <main class="main">
            <section class="sources-section" aria-labelledby="sources-heading">
                <div class="sources-section__head">
                    <h2 id="sources-heading" class="section-title">News sources</h2>
                </div>
                <div class="sources buttons" role="list"></div>
            </section>

            <div class="main__body page__container">
                <section class="news-section" aria-label="News articles">
                    <div class="news"></div>
                </section>
            </div>
        </main>

        <footer class="footer">
            <div class="page__container footer__inner">
                <p class="footer__copyright">
                    <span class="footer__year">2026</span>
                    <a
                        class="footer__link"
                        href="https://github.com/bykovskiy-dev"
                        target="_blank"
                        rel="noopener noreferrer"
                        >bykovskiy-dev</a
                    >
                </p>
                <a
                    class="footer__course"
                    href="https://rs.school/courses/javascript"
                    target="_blank"
                    rel="noopener noreferrer"
                    title="RS School JavaScript course"
                >
                    <img
                        class="footer__logo"
                        src="https://rs.school/_next/static/media/rss-logo.c19ce1b4.svg"
                        alt="RS School logo"
                        width="80"
                        height="32"
                    />
                </a>
            </div>
        </footer>

        <template id="sourceItemTemp">
            <div class="source__item" role="listitem" tabindex="0">
                <span class="source__item-name"></span>
            </div>
        </template>

        <template id="newsItemTemp">
            <article class="news__item">
                <div class="news__meta">
                    <div class="news__meta-photo"></div>
                    <ul class="news__meta-details">
                        <li class="news__meta-author"></li>
                        <li class="news__meta-date"></li>
                    </ul>
                </div>
                <div class="news__description">
                    <h2 class="news__description-title"></h2>
                    <h3 class="news__description-source"></h3>
                    <p class="news__description-content"></p>
                    <p class="news__read-more">
                        <a href="#" target="_blank" rel="noopener noreferrer">Read More</a>
                    </p>
                </div>
            </article>
        </template>
    </body>
</html>
